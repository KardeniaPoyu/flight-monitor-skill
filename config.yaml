# ===== 考试日程 (修改这里适配你的考试安排) =====
exam_schedule:
  阪大:
    笔试: "2026-08-01"
    面试: "2026-08-03"
  东科大:
    笔试: "2026-08-18"
    面试: "2026-08-24"
  东大:
    笔试: "2026-08-20"
    専門: "2026-08-26"
    面试: "2026-08-27"
