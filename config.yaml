# ===== 考试日程 (修改这里适配你的考试安排) =====
# 格式: 学校名 > 考试类型 > 日期 (YYYY-MM-DD)
exam_schedule:
  Example University:
    笔试: "2026-08-01"
    面试: "2026-08-03"

# ===== 目标价格 (CNY) =====
target_price: 1000

# ===== 汇率 (USD → CNY) =====
exchange_rate: 7.2

# ===== 航线 =====
# auto_date 语法: "学校名.考试类型 [+/- 天数]"
#   示例: "Example University.笔试 - 1" = 笔试前一天
#   示例: "Example University.面试 + 1" = 面试后一天
# min_departure_hour: 最早起飞时间 (可选, 0-23)
routes:
  - {id: 1, from: SHA, to: KIX, auto_date: "Example University.笔试 - 1", label: "出发→大阪"}
  - {id: 2, from: KIX, to: SHA, auto_date: "Example University.面试", label: "大阪→出发"}